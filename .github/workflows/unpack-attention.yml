name: Unpack AGILLM attention branch

on:
  push:
    branches:
      - agillm-attention-v1
    paths:
      - .github/workflows/unpack-attention.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agillm-attention-v1
          fetch-depth: 0

      - name: Verify and unpack reviewed bundle
        shell: bash
        run: |
          set -euo pipefail
          cat attention_bundle.part1.b64 attention_bundle.part2.b64 | base64 --decode > /tmp/agillm_attention_bundle.tgz
          echo "622cf7eda456cb7650009f1a1be91697b0c2dc7a2521c692df531f85b443cbf2  /tmp/agillm_attention_bundle.tgz" | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path
          import tarfile

          archive = Path('/tmp/agillm_attention_bundle.tgz')
          with tarfile.open(archive, 'r:gz') as handle:
              for member in handle.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
              handle.extractall('.')
          PY
          rm -f attention_bundle.part1.b64 attention_bundle.part2.b64
          rm -f .github/workflows/unpack-attention.yml

      - name: Commit normal source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGILLM Attention Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add isolated AGILLM attention backend and runtime builder"
          git push origin HEAD:agillm-attention-v1
